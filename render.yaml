services:
  - type: web
    name: volunteer-crmoll-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: DATABASE_URL
        fromDatabase:
          name: volunteer-db
          property: connectionString

databases:
  - name: volunteer-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"