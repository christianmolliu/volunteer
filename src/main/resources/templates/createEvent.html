<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Volunteer Finder</title>
  <link rel="stylesheet" type="text/css" th:href="@{../css/styles.css}" />
</head>
<body>
<div class="header">
  <img class="logo" th:src="@{images/black-white-letter-v-minimalistic-lines-logo.svg}"/>
  <div class="login-logout">
    <div class="login-reg" th:if="${user == null}">
      <a href="/login">login</a>
      <a href="/register">register</a>
    </div>
    <div class="logout" th:if="${user != null}">
      <form method="POST" th:action="@{/logout}">
        <input type="submit" value="Logout">
      </form>
      <a th:href="@{/notifications}"><img class="noti" th:src="@{images/noti-icon.png}"></a>
    </div>
  </div>
</div>
  <form method="POST" th:action="@{/create}" th:object="${event}">
    <h1>Create an Event</h1>
    <div>
      <h2>Title</h2>
      <input type="text" th:field="*{title}"/>
      <br>
      <h2>Description</h2>
      <input type="text" th:field="*{description}">
      <br>
      <label>
        <h2>Start Date</h2>
        <input type="date" th:field="*{startDate}">
      </label>
      <br>
      <label>
        <h2>End Date</h2>
        <input type="date" th:field="*{endDate}">
      </label>
      <label>
        <h2>Approximate Hours</h2>
        <input type="number" step="0.25" min="0.25" th:field="*{approxHours}">
      </label>
      <label>
        <h2>Location</h2>
        <input type="text"
               th:field="*{location}">
      </label>
    </div>
    <br>
    <button>Submit</button>
  </form>
  <a href="/">Back to Events</a>
</body>
</html>
